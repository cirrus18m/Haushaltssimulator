# Veröffentlicht den Ordner insights/ (Foliensätze) auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Insights auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "insights/**"
      - ".github/workflows/insights-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: insights
      - id: deployment
        uses: actions/deploy-pages@v5
